document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

w !important;flex-wrap:nowrap !important;overflow-x:auto !important;gap:8px !important;padding:10px 12px !important;-webkit-overflow-scrolling:touch;}.dtx-nav button{width:auto !important;white-space:nowrap !important;padding:9px 13px !important;}.dtx-meta{display:none !important;}.dtx-main{min-height:0 !important;}.dtx-head{padding:18px 16px 14px !important;gap:14px !important;}.dtx-head h1{font-size:21px !important;}.dtx-body{padding:18px 12px 64px !important;}}</style>\n<div class=\"dtx-root\" style=\"display:flex;align-items:flex-start;min-height:100vh;background:#F1F3F6\">\n\n  <aside class=\"dtx-aside\" style=\"position:sticky;top:0;flex:0 0 234px;align-self:flex-start;height:100vh;overflow-y:auto;overflow-x:hidden;background:#022064;display:flex;flex-direction:column\">\n    <div style=\"position:absolute;bottom:-10%;left:-40%;width:160%;height:38%;transform:skewY(-14deg);background:linear-gradient(180deg,rgba(244,148,29,0) 0%,rgba(244,148,29,0.16) 100%);pointer-events:none\"></div>\n    <div style=\"position:relative;padding:26px 22px 22px;border-bottom:1px solid rgba(255,255,255,0.1)\">\n      <img src=\"36ece026-4b96-468f-b34b-225614d20794\" alt=\"Disktrans\" style=\"height:24px;width:auto;display:block\">\n      <p style=\"margin:16px 0 0;font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.17em;text-transform:uppercase;color:#F4941D\">Controle CS</p>\n      <p style=\"margin:5px 0 0;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,0.68)\">Operação de trocas</p>\n    </div>\n    <nav class=\"dtx-nav\" style=\"position:relative;padding:16px 12px;display:flex;flex-direction:column;gap:3px\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-radius:8px;padding:11px 12px;background:{{ t.bg }};color:{{ t.color }};font-family:'Barlow',sans-serif;font-size:14.5px;font-weight:{{ t.weight }};cursor:pointer;transition:background .2s ease,color .2s ease\" style-hover=\"background:rgba(255,255,255,0.08);color:#ffffff\">\n          <span style=\"flex:none;width:3px;height:16px;border-radius:999px;background:{{ t.mark }}\"></span>{{ t.label }}\n        </button>\n      </sc-for>\n    </nav>\n    <div class=\"dtx-meta\" style=\"position:relative;margin-top:auto;padding:20px 22px 24px;border-top:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ metaItems }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <div>\n          <p style=\"margin:0;font-family:'Barlow',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.62)\">{{ m.label }}</p>\n          <p style=\"margin:4px 0 0;font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;color:#ffffff;font-variant-numeric:tabular-nums\">{{ m.value }}</p>\n        </div>\n      </sc-for>\n      <sc-if value=\"{{ isDemo }}\">\n        <span style=\"align-self:flex-start;border-radius:999px;padding:5px 11px;background:#F4941D;font-family:'Barlow',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#2C303E\">Modo demonstração</span>\n      </sc-if>\n    </div>\n  </aside>\n\n  <div class=\"dtx-main\" style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:100vh\">\n\n    <div class=\"dtx-head\" style=\"padding:34px 36px 28px;background:#ffffff;border-bottom:1px solid #E7EBF1;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between\">\n      <div style=\"min-width:0;max-width:720px\">\n        <p style=\"margin:0 0 9px;font-family:'Barlow',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.17em;text-transform:uppercase;color:#F4941D\">{{ viewEyebrow }}</p>\n        <h1 style=\"margin:0;font-family:'Barlow',sans-serif;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-0.015em;color:#022064\">{{ viewTitle }}</h1>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:#6B7280;text-wrap:pretty\">{{ viewSub }}</p>\n      </div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end\">\n        <sc-for list=\"{{ filtros }}\" as=\"fl\" hint-placeholder-count=\"2\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Barlow',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#5A6270\">{{ fl.label }}</span>\n            <sc-raw-select value=\"{{ fl.value }}\" sc-camel-on-change=\"{{ fl.onChange }}\" style=\"appearance:none;-webkit-appearance:none;min-width:126px;padding:10px 34px 10px 13px;border:1px solid #D6DAE2;border-radius:8px;background-color:#ffffff;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%228%22 sc-camel-view-box=%220 0 12 8%22&gt;&lt;path d=%22M1 1.5 6 6.5 11 1.5%22 fill=%22none%22 stroke=%22%236B7280%22 stroke-width=%221.6%22 stroke-linecap=%22round%22/&gt;&lt;/svg&gt;');background-repeat:no-repeat;background-position:right 12px center;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;color:#022064;cursor:pointer\" style-focus=\"outline:none;border-color:#0A7AC9;box-shadow:0 0 0 3px rgba(10,122,201,0.35)\">\n              <sc-for list=\"{{ fl.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <option value=\"{{ o.value }}\">{{ o.label }}</option>\n              </sc-for>\n            </sc-raw-select>\n          </label>\n        </sc-for>\n        <sc-if value=\"{{ filtroAtivo }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ limparFiltro }}\" style=\"align-self:flex-end;border:1px solid #F4941D;border-radius:8px;padding:10px 15px;background:#FCEFD9;color:#8A5A08;font-family:'Barlow',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#F4941D;color:#2C303E\">Limpar filtro</button>\n        </sc-if>\n        <div style=\"align-self:flex-end;display:flex;align-items:center;gap:9px;border:1px solid #D6DAE2;border-radius:999px;padding:10px 14px;font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5A6270\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#506A5F\"></span>Dados locais\n        </div>\n      </div>\n    </div>\n\n    <main class=\"dtx-body\" style=\"flex:1;padding:34px 36px 80px;min-width:0\">\n\n      <sc-if value=\"{{ isLoading }}\">\n        <p style=\"margin:0;padding:80px 0;text-align:center;font-size:14px;color:#8A93A4\">Carregando dados…</p>\n      </sc-if>\n\n      <sc-if value=\"{{ needsData }}\">\n        <div sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"background:#ffffff;border:2px dashed {{ dropBorder }};border-radius:14px;padding:64px 32px;text-align:center;transition:border-color .2s ease\">\n          <p style=\"margin:0 0 10px;font-family:'Barlow',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.17em;text-transform:uppercase;color:#F4941D\">Nenhum dado carregado</p>\n          <h2 style=\"margin:0 0 12px;font-family:'Barlow',sans-serif;font-size:26px;font-weight:800;color:#022064\">Arraste o arquivo de dados para cá</h2>\n          <p style=\"margin:0 auto 26px;max-width:520px;font-size:14px;line-height:1.65;color:#6B7280\">O painel tenta ler <strong style=\"color:#022064;font-weight:600\">saida/dashboard_data.json</strong> automaticamente. Quando o arquivo não está acessível — como na versão publicada — solte o JSON aqui ou selecione-o abaixo. Ele fica salvo neste navegador.</p>\n          <label style=\"position:relative;display:inline-flex;align-items:center;gap:10px;background:#F4941D;color:#2C303E;border-radius:8px;padding:13px 22px;font-family:'Barlow',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#E08412\">\n            Selecionar dashboard_data.json\n            <input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onPick }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\">\n          </label>\n        </div>\n      </sc-if>\n\n      <sc-if value=\"{{ hasData }}\">\n        <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n          <div style=\"margin-bottom:34px\">\n            <sc-if value=\"{{ sec.hasHead }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:15px\">\n                <h3 style=\"margin:0;font-family:'Barlow',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#022064\">{{ sec.kicker }}</h3>\n                <span style=\"width:30px;height:2px;background:#F4941D\"></span>\n                <span style=\"font-size:12.5px;color:#5A6270\">{{ sec.hint }}</span>\n              </div>\n            </sc-if>\n            <div style=\"display:grid;gap:18px;grid-template-columns:{{ sec.grid }}\">\n              <sc-for list=\"{{ sec.blocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <section style=\"position:relative;background:#ffffff;border:1px solid #E7EBF1;border-radius:14px;box-shadow:0 1px 2px rgba(2,32,100,0.04),0 14px 34px -22px rgba(2,32,100,0.24);display:flex;flex-direction:column;min-width:0;overflow:visible\">\n\n                  <sc-if value=\"{{ b.isKpi }}\">\n                    <div style=\"padding:20px 22px 22px\">\n                      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n                        <p style=\"margin:0;font-family:'Barlow',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#6B7280;line-height:1.45\">{{ b.label }}</p>\n                        <sc-if value=\"{{ b.showTip }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ b.onTip }}\" title=\"Como este indicador é calculado\" style=\"flex:none;width:22px;height:22px;padding:0;border-radius:50%;border:1px solid #D6DAE2;background:#F5F6F8;color:#5A6270;font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"border-color:#F4941D;color:#F4941D\">?</button>\n                        </sc-if>\n                      </div>\n                      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:14px\">\n                        <div style=\"min-width:0\">\n                          <p style=\"margin:0;font-family:'Barlow',sans-serif;font-size:36px;font-weight:800;line-height:1;letter-spacing:-0.02em;color:#022064;font-variant-numeric:tabular-nums\">{{ b.value }}</p>\n                          <sc-if value=\"{{ b.hasSub }}\">\n                            <p style=\"margin:9px 0 0;font-size:12px;line-height:1.5;color:#6B7280\">{{ b.sub }}</p>\n                          </sc-if>\n                        </div>\n                        <sc-if value=\"{{ b.isRing }}\">\n                          <div style=\"flex:none;position:relative;width:66px;height:66px;border-radius:50%;background:{{ b.ring }}\">\n                            <div style=\"position:absolute;inset:9px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:700;color:{{ b.ringColor }}\">{{ b.ringLabel }}</div>\n                          </div>\n                        </sc-if>\n                      </div>\n                      <sc-if value=\"{{ b.isSpark }}\">\n                        <div style=\"position:relative;height:46px;margin-top:16px\">\n                          <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,122,201,0.55) 0%,rgba(10,122,201,0) 100%);clip-path:{{ b.area }}\"></div>\n                          <div style=\"position:absolute;inset:0;background:#0A7AC9;clip-path:{{ b.line }}\"></div>\n                        </div>\n                      </sc-if>\n                      <sc-if value=\"{{ b.isScale }}\">\n                        <div style=\"margin-top:18px\">\n                          <div style=\"position:relative;height:5px;border-radius:999px;background:#EDF0F5\">\n                            <sc-for list=\"{{ b.marks }}\" as=\"mk\" hint-placeholder-count=\"3\">\n                              <span title=\"{{ mk.title }}\" style=\"position:absolute;top:-4px;left:{{ mk.x }};width:3px;height:13px;border-radius:999px;background:{{ mk.color }};transform:translateX(-1px)\"></span>\n                            </sc-for>\n                          </div>\n                          <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:12px\">\n                            <sc-for list=\"{{ b.marks }}\" as=\"mk\" hint-placeholder-count=\"3\">\n                              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B7280\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ mk.color }}\"></span>{{ mk.label }}</span>\n                            </sc-for>\n                          </div>\n                        </div>\n                      </sc-if>\n                      <sc-if value=\"{{ b.tipOpen }}\">\n                        <div style=\"position:absolute;z-index:30;top:52px;right:14px;width:268px;max-width:calc(100vw - 40px);background:#2C303E;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:15px 17px;box-shadow:0 24px 48px -16px rgba(2,32,100,0.42)\">\n                          <p style=\"margin:0;font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#F4941D\">Como calculamos</p>\n -count=\"6\">\n                        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:14px;align-items:center\">\n                          <div style=\"min-width:0\">\n                            <p style=\"margin:0 0 7px;font-size:13px;line-height:1.3;color:#3A3A4A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.label }}</p>\n                            <div style=\"height:7px;border-radius:999px;background:#EDF0F5;overflow:hidden\">\n                              <div style=\"height:100%;border-radius:999px;width:{{ it.pct }};background:{{ it.fill }}\"></div>\n                            </div>\n                          </div>\n                          <p style=\"margin:0;text-align:right;font-family:'Barlow',sans-serif;font-size:15.5px;font-weight:700;color:#022064;font-variant-numeric:tabular-nums\">{{ it.value }}</p>\n                        </div>\n                      </sc-for>\n                      <sc-if value=\"{{ b.isEmptyList }}\">\n                        <p style=\"margin:0;padding:22px 0;text-align:center;font-size:13px;color:#6B7280\">Sem dados para o período.</p>\n                      </sc-if>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isArea }}\">\n                    <div style=\"padding:24px 22px 20px\">\n                      <div style=\"position:relative;height:220px\">\n                        <sc-for list=\"{{ b.grid }}\" as=\"g\" hint-placeholder-count=\"5\">\n                          <div style=\"position:absolute;left:0;right:0;top:{{ g.y }};height:1px;background:#EDF0F5\"></div>\n                        </sc-for>\n                        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,{{ b.fillFrom }} 0%,rgba(0,0,0,0) 100%);clip-path:{{ b.area }}\"></div>\n                        <div style=\"position:absolute;inset:0;background:{{ b.color }};clip-path:{{ b.line }}\"></div>\n                        <sc-for list= nt-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:#6B7280;padding:13px 18px;background:#FBFCFD;border-bottom:1px solid #E7EBF1;white-space:nowrap\">{{ c.label }}</sc-raw-th>\n                            </sc-for>\n                          </sc-raw-tr>\n                        </sc-raw-thead>\n                        <sc-raw-tbody>\n                          <sc-for list=\"{{ b.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                            <sc-raw-tr style-hover=\"background:#FAFBFC\">\n                              <sc-for list=\"{{ r.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                                <sc-raw-td style=\"padding:{{ cell.pad }};border-bottom:1px solid #F2F4F7;text-align:{{ cell.align }};color:{{ cell.color }};font-size:{{ cell.size }};font-variant-numeric:tabular-nums;white-space:{{ cell.wrap }};line-height:1.45\">\n                                  <sc-if value=\"{{ cell.isBadge }}\">\n                                    <span style=\"display:inline-block;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;background:{{ cell.bg }};color:{{ cell.fg }}\">{{ cell.text }}</span>\n                                  </sc-if>\n                                  <sc-if value=\"{{ cell.isText }}\">{{ cell.text }}</sc-if>\n                                </sc-raw-td>\n                              </sc-for>\n                            </sc-raw-tr>\n                          </sc-for>\n                        </sc-raw-tbody>\n                      </sc-raw-table>\n                      <sc-if value=\"{{ b.isEmptyList }}\">\n                        <p style=\"margin:0;padding:40px 0;text-align:center;font-size:13px;color:#6B7280\">Sem registros para exibir.</p>\n                      </sc-if>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isChips }}\">\n                    <div style=\"padding:17px 22px;display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-for list=\"{{ b.items }}\" as=\"c\" hint-placeholder-count=\"6\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"border-radius:999px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};padding:8px 15px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:{{ c.weight }};cursor:pointer;transition:all .2s ease\" style-hover=\"border-color:#F4941D\">{{ c.label }}</button>\n                      </sc-for>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isSearch }}\">\n                    <div style=\"padding:17px 22px\">\n                      <input type=\"text\" value=\"{{ b.value }}\" sc-camel-on-change=\"{{ b.onChange }}\" placeholder=\"Filtrar por assunto…\" style=\"width:100%;max-width:400px;box-sizing:border-box;padding:12px 15px;border:1px solid #D6DAE2;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;color:#022064;background:#ffffff\" style-focus=\"outline:none;border-color:#0A7AC9;box-shadow:0 0 0 3px rgba(10,122,201,0.3)\">\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isConc }}\">\n                    <div style=\"padding:6px 22px 22px\">\n                      <sc-for list=\"{{ b.items }}\" as=\"c\" hint-placeholder-count=\"6\">\n                        <div style=\"display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px;align-items:start;padding:18px 0;border-bottom:1px solid #EEF1F5\">\n                          <span style=\"width:34px;height:34px;border-radius:50%;background:#F1F4F9;display:flex;align-items:center;justify-content:center;font-family:'Barlow',sans-serif;font-size:14px;font-weight:800;color:#022064\">{{ c.n }}</span>\n                          <div style=\"min-width:0\">\n                            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#1B1F2A;text-wrap:pretty\">{{ c.text }}</p>\n                            <span style=\"display:inline-block;margin-top:9px;border-radius:999px;padding:3px 10px;font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;background:{{ c.tagBg }};color:{{ c.tagFg }}\">{{ c.tag }}</span>\n                          </div>\n                        </div>\n                      </sc-for>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isMatrix }}\">\n                    <div style=\"overflow-x:auto\">\n                      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n                        <sc-raw-thead>\n                          <sc-raw-tr>\n                            <sc-raw-th style=\"text-align:left;font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:#8A93A4;padding:13px 18px;background:#FBFCFD;border-bottom:1px solid #E7EBF1;white-space:nowrap\">{{ b.corner }}</sc-raw-th>\n                            <sc-for list=\"{{ b.cols }}\" as=\"c\" hint-placeholder-count=\"5\">\n                              <sc-raw-th style=\"text-align:center;font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8A93A4;padding:13px 10px;background:#FBFCFD;border-bottom:1px solid #E7EBF1;line-height:1.35;min-width:96px\">{{ c.label }}</sc-raw-th>\n                            </sc-for>\n                            <sc-raw-th style=\"text-align:right;font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:#022064;padding:13px 18px;background:#FBFCFD;border-bottom:1px solid #E7EBF1;white-space:nowrap\">Total</sc-raw-th>\n                          </sc-raw-tr>\n                        </sc-raw-thead>\n                        <sc-raw-tbody>\n                          <sc-for list=\"{{ b.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                            <sc-raw-tr>\n                              <sc-raw-td style=\"padding:12px 18px;border-bottom:1px solid #F2F4F7;color:#1B1F2A;font-weight:500;white-space:nowrap\">{{ r.label }}</sc-raw-td>\n                              <sc-for list=\"{{ r.cells }}\" as=\"cl\" hint-placeholder-count=\"5\">\n                                <sc-raw-td title=\"{{ cl.title }}\" style=\"padding:4px;border-bottom:1px solid #F2F4F7;text-align:center\">\n                                  <span style=\"display:block;padding:9px 4px;border-radius:6px;background:{{ cl.bg }};color:{{ cl.fg }};font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums\">{{ cl.v }}</span>\n                                </sc-raw-td>\n                              </sc-for>\n                              <sc-raw-td style=\"padding:12px 18px;border-bottom:1px solid #F2F4F7;text-align:right;font-family:'Barlow',sans-serif;font-size:15px;font-weight:700;color:#022064;font-variant-numeric:tabular-nums\">{{ r.total }}</sc-raw-td>\n                            </sc-raw-tr>\n                          </sc-for>\n                        </sc-raw-tbody>\n                      </sc-raw-table>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isResumo }}\">\n                    <div style=\"padding:24px 22px 26px\">\n                      <p style=\"margin:0 0 22px;max-width:820px;font-family:'Barlow',sans-serif;font-size:20px;font-weight:600;line-height:1.45;color:#022064;text-wrap:pretty\">{{ b.lead }}</p>\n                      <div style=\"display:grid;gap:1px;background:#E7EBF1;border:1px solid #E7EBF1;border-radius:10px;overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n                        <sc-for list=\"{{ b.items }}\" as=\"r\" hint-placeholder-count=\"6\">\n                          <div style=\"background:#ffffff;padding:16px 18px 18px\">\n                            <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#5A6270\"><span style=\"width:14px;height:2px;background:{{ r.color }}\"></span>{{ r.label }}</p>\n                            <p style=\"margin:9px 0 0;font-family:'Barlow',sans-serif;font-size:16px;font-weight:700;line-height:1.3;color:#022064\">{{ r.value }}</p>\n                            <p style=\"margin:5px 0 0;font-size:12px;line-height:1.45;color:#5A6270\">{{ r.sub }}</p>\n                          </div>\n                        </sc-for>\n                      </div>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ b.isNote }}\">\n                    <div style=\"padding:{{ b.pad }};text-align:{{ b.align }};max-width:{{ b.maxW }};font-size:14px;line-height:1.7;color:#3A3A4A\">{{ b.text }}</div>\n                  </sc-if>\n\n                </section>\n              </sc-for>\n            </div>\n          </div>\n        </sc-for>\n      </sc-if>\n    </main>\n\n    <footer style=\"border-top:1px solid #E7EBF1;background:#ffffff;padding:22px 36px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:11.5px;color:#6B7280\">\n      <span>Controle CS · Operação de trocas Disktrans — uso interno</span>\n      <span>Indicadores calculados a partir de dashboard_data.json</span>\n    </footer>\n    \n  </div>\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;densidade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Respirada&quot;,&quot;Compacta&quot;],&quot;default&quot;:&quot;Respirada&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Leitura&quot;},&quot;mostrarRacional&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Leitura&quot;},&quot;topRanking&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:15,&quot;step&quot;:1,&quot;unit&quot;:&quot; itens&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Leitura&quot;}}\">\nconst TAB_LIST = [\n  [\"executivo\", \"Executivo\"],\n  [\"motivos\", \"Motivos & gargalos\"],\n  [\"atendimentos\", \"Atendimentos\"],\n  [\"qualidade\", \"Qualidade\"],\n  [\"produtividade\", \"Produtividade\"],\n  [\"diagnostico\", \"Diagnóstico\"],\n  [\"naolidos\", \"Não lidos\"]\n];\nconst PAL = [\"#004C96\", \"#F4941D\", \"#0A7AC9\", \"#022064\", \"#8A93A4\", \"#C2DCF1\"];\nconst BLUE_FILL = \"linear-gradient(90deg,#004C96 0%,#0A7AC9 100%)\";\nconst ORANGE_FILL = \"linear-gradient(90deg,#C7740A 0%,#F4941D 100%)\";\nconst MESES = [\"janeiro\", \"fevereiro\", \"março\", \"abril\", \"maio\", \"junho\", \"julho\", \"agosto\", \"setembro\", \"outubro\", \"novembro\", \"dezembro\"];\nconst DIAS = [\"segunda\", \"terça\", \"quarta\", \"quinta\", \"sexta\", \"sábado\", \"domingo\"];\nconst VIEW_COPY = {\n  executivo: [\"Resumo executivo\", \"Como está a caixa de trocas\", \"Volume consolidado, capacidade de resposta e onde a operação está travando — em uma tela.\"],\n  motivos: [\"Diagnóstico\", \"Por que o cliente nos procura\", \"A causa de cada contato, o obstáculo que atrasou a solução e como isso evoluiu semana a semana.\"],\n  atendimentos: [\"Distribuição\", \"Onde e quando o volume acontece\", \"Quais clientes e unidades acionam mais, e em que dia e horário a caixa enche.\"],\n  qualidade: [\"Qualidade\", \"O que o atendimento deixou passar\", \"Reclamações, notas registradas, contatos evitáveis e a régua completa de tempo de resposta.\"],\n  produtividade: [\"Produtividade\", \"O que ocupa a caixa de entrada\", \"Conversas por assunto, volume de e-mails e onde a fila está parada.\"],\n  diagnostico: [\"Diagnóstico gerencial\", \"O que os dados estão tentando nos dizer\", \"Conclusões calculadas sobre a operação, os dez maiores ofensores e o cruzamento cliente × causa. Cada leitura vem marcada como dado observado ou inferência.\"],\n  naolidos: [\"Caixa de entrada\", \"Não lidos na caixa de trocas\", \"Volume atual de não lidos e o histórico de quanto sobrou no fim do expediente (18h) e no fim do dia (23:59).\"]\n};\n\nclass Component extends DCLogic {\n  state = { data: null, loading: true, tab: \"executivo\", fGargalo: \"Todos\", fAssunto: \"\", tip: null, dragging: false, fAno: \"Todos\", fMes: \"Todos\" };\n\n  componentDidMount() {\n    let t = null;\n    try { t = new URLSearchParams(location.search).get(\"tab\"); } catch (e) {}\n    if (t && TAB_LIST.some(x => x[0] === t)) this.setState({ tab: t });\n    fetch(\"saida/dashboard_data.json\", { cache: \"no-store\" })\n      .then(r => (r.ok ? r.json() : Promise.reject()))\n      .then(d => this.setState({ data: d, loading: false }))\n      .catch(() => {\n        let c = null;\n        try { c = JSON.parse(localStorage.getItem(\"cs_painel_dados\") || \"null\"); } catch (e) {}\n        this.setState({ data: c, loading: false });\n      });\n  }\n\n  /* ---------- utils ---------- */\n  nf(n) { return n == null || n === \"\" ? \"—\" : Number(n).toLocaleString(\"pt-BR\"); }\n  pctStr(v, t) { return (t ? (v / t * 100) : 0).toFixed(1).replace(\".\", \",\") + \"%\"; }\n  fmtData(d) {\n    if (!d) return \"—\";\n    const p = String(d).slice(0, 10).split(\"-\");\n    return p.length === 3 ? p[2] + \"/\" + p[1] + \"/\" + p[0] : String(d);\n  }\n  counts(arr, key) {\n    const m = new Map();\n    (arr || []).forEach(x => {\n      const k = (x[key] == null ? \"não identificado\" : x[key]) || \"não identificado\";\n      m.set(k, (m.get(k) || 0) + 1);\n    });\n    return [...m].map(e => ({ label: e[0], value: e[1] })).sort((a, b) => b.value - a.value);\n  }\n  compacta() { return (this.props.densidade || \"Respirada\") === \"Compacta\"; }\n  padCell() { return this.compacta() ? \"9px 16px\" : \"15px 18px\"; }\n  topN() { const n = Number(this.props.topRanking); return n > 0 ? Math.round(n) : 10; }\n\n  /* semanas ISO (segunda) a partir de casos[].data */\n  semanal(casos, keys) {\n    const m = new Map();\n    (casos || []).forEach(c => {\n      const d = new Date(c.data);\n      if (isNaN(d)) return;\n      const on = new Date(d);\n      on.setDate(d.getDate() - ((d.getDay() + 6) % 7));\n      const key = on.getFullYear() + \"-\" + String(on.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(on.getDate()).padStart(2, \"0\");\n      const lb = String(on.getDate()).padStart(2, \"0\") + \"/\" + String(on.getMonth() + 1).padStart(2, \"0\");\n      if (!m.has(key)) m.set(key, { label: lb, total: 0 });\n      const r = m.get(key);\n      r.total++;\n      if (keys && keys.indexOf(c.motivo) >= 0) r[c.motivo] = (r[c.motivo] || 0) + 1;\n    });\n    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(e => e[1]);\n  }\n\n  /* ---------- chart builders ---------- */\n  polys(vals, band) {\n    const n = vals.length;\n    const max = Math.max(1, ...vals);\n    const pt = i => ({\n      x: n === 1 ? 50 : (i / (n - 1)) * 100,\n      y: (1 - (vals[i] || 0) / max) * 100\n    });\n    const pts = vals.map((v, i) => pt(i));\n    const fwd = pts.map(p => p.x.toFixed(2) + \"% \" + p.y.toFixed(2) + \"%\");\n    const back = pts.slice().reverse().map(p => p.x.toFixed(2) + \"% \" + Math.min(100, p.y + band).toFixed(2) + \"%\");\n    return {\n      max: max,\n      pts: pts,\n      area: \"polygon(\" + pts[0].x.toFixed(2) + \"% 100%,\" + fwd.join(\",\") + \",\" + pts[n - 1].x.toFixed(2) + \"% 100%)\",\n      line: \"polygon(\" + fwd.concat(back).join(\",\") + \")\"\n    };\n  }\n  sparkKpi(vals) {\n    if (!vals.length) return { isSpark: false };\n    const p = this.polys(vals, 8);\n    return { isSpark: true, area: p.area, line: p.line };\n  }\n  areaBlock(title, hint, items, color, fillFrom) {\n    const list = items || [];\n    if (list.length < 2) {\n      return { isArea: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\", isEmptyList: true,\n        cols: [], grid: [], dots: [], labels: [], area: \"none\", line: \"none\", color: color, fillFrom: fillFrom, maxLabel: \"—\" };\n    }\n    const p = this.polys(list.map(i => Number(i.value) || 0), 2.2);\n    const step = Math.max(1, Math.ceil(list.length / 6));\n    return {\n      isArea: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\", isEmptyList: false,\n      color: color || \"#0A7AC9\", fillFrom: fillFrom || \"rgba(10,122,201,0.30)\",\n      maxLabel: this.nf(p.max),\n      area: p.area, line: p.line,\n      grid: [0, 25, 50, 75, 100].map(y => ({ y: y + \"%\" })),\n      dots: p.pts.map((pp, i) => ({\n        x: pp.x.toFixed(2) + \"%\", y: pp.y.toFixed(2) + \"%\",\n        title: list[i].label + \": \" + this.nf(list[i].value)\n      })),\n      labels: p.pts.map((pp, i) => ({\n        x: pp.x.toFixed(2) + \"%\", y: pp.y.toFixed(2) + \"%\",\n        tx: i === 0 ? \"translate(0,-24px)\" : (i === list.length - 1 ? \"translate(-100%,-24px)\" : \"translate(-50%,-24px)\"),\n        v: this.nf(list[i].value),\n        keep: i % step === 0 || (i === list.length - 1 && (list.length - 1) % step >= 2)\n      })).filter(l => l.keep),\n      cols: list.map((it, i) => ({ label: i % step === 0 ? it.label : \"\" }))\n    };\n  }\n  donutBlock(title, hint, items, totalLabel) {\n    const list = (items || []).slice(0, 6);\n    const total = list.reduce((a, i) => a + (Number(i.value) || 0), 0) || 1;\n    let acc = 0;\n    const stops = list.map((i, j) => {\n      const from = acc / total * 100;\n      acc += Number(i.value) || 0;\n      const to = acc / total * 100;\n      return PAL[j % PAL.length] + \" \" + from.toFixed(2) + \"% \" + to.toFixed(2) + \"%\";\n    });\n    return {\n      isDonut: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\",\n      gradient: \"conic-gradient(\" + (stops.length ? stops.join(\",\") : \"#E9ECF1 0 100%\") + \")\",\n      total: this.nf(total), totalLabel: totalLabel || \"casos\",\n      legend: list.map((i, j) => ({\n        label: i.label, value: this.nf(i.value),\n        pct: this.pctStr(Number(i.value) || 0, total), color: PAL[j % PAL.length]\n      }))\n    };\n  }\n  colsBlock(title, hint, items, fill) {\n    const list = items || [];\n    const max = Math.max(1, ...list.map(i => Number(i.value) || 0));\n    return {\n      isCols: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\",\n      cols: list.map(i => ({\n        label: String(i.label), value: this.nf(i.value),\n        title: (i.full || i.label) + \": \" + this.nf(i.value),\n        h: Math.max(2, (Number(i.value) || 0) / max * 100).toFixed(1) + \"%\",\n        fill: fill || BLUE_FILL\n      }))\n    };\n  }\n  comOutros(list, n) {\n    const l = list || [];\n    if (l.length <= n) return l.slice();\n    const top = l.slice(0, n);\n    const resto = l.slice(n).reduce((a, i) => a + (Number(i.value) || 0), 0);\n    return top.concat([{ label: \"Outros (\" + (l.length - n) + \" itens)\", value: resto }]);\n  }\n  barsBlock(title, hint, items, fill) {\n    const list = items || [];\n    const max = Math.max(1, ...list.map(i => Number(i.value) || 0));\n    return {\n      isBars: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\", isEmptyList: !list.length,\n      items: list.map(i => ({\n        label: String(i.label), value: this.nf(i.value),\n        pct: ((Number(i.value) || 0) / max * 100).toFixed(1) + \"%\", fill: fill || BLUE_FILL\n      }))\n    };\n  }\n\n  /* ---------- kpi ---------- */\n  kpi(id, label, value, calc, fonte, o) {\n    o = o || {};\n    const b = {\n      isKpi: true, label: label, value: value == null ? \"—\" : String(value),\n      hasSub: !!o.sub, sub: o.sub || \"\", calc: calc, fonte: fonte,\n      showTip: this.props.mostrarRacional !== false,\n      isRing: false, isSpark: false, isScale: false,\n      tipOpen: this.state.tip === id,\n      onTip: () => this.setState({ tip: this.state.tip === id ? null : id })\n    };\n    if (o.ring != null) {\n      const p = Math.max(0, Math.min(100, Number(o.ring) || 0));\n      b.isRing = true;\n      b.ring = \"conic-gradient(\" + (o.ringColor || \"#F4941D\") + \" 0 \" + p.toFixed(1) + \"%,#E9ECF1 \" + p.toFixed(1) + \"% 100%)\";\n      b.ringColor = o.ringColor || \"#F4941D\";\n      b.ringLabel = o.ringLabel || Math.round(p) + \"%\";\n    }\n    if (o.spark && o.spark.length > 1) Object.assign(b, this.sparkKpi(o.spark));\n    if (o.marks) { b.isScale = true; b.marks = o.marks; }\n    return b;\n  }\n\n  /* ---------- tables ---------- */\n  cell(text, o) {\n    o = o || {};\n    return {\n      isText: !o.badge, isBadge: !!o.badge, text: text == null || text === \"\" ? \"—\" : String(text),\n      align: o.align || \"left\", color: o.color || \"#3A3A4A\",\n      size: o.size || (this.compacta() ? \"12px\" : \"13px\"), pad: this.padCell(),\n      wrap: o.wrap || \"normal\", bg: o.bg || \"transparent\", fg: o.fg || \"#3A3A4A\"\n    };\n  }\n  numCell(v) { return this.cell(this.nf(v), { align: \"right\", color: \"#022064\", wrap: \"nowrap\" }); }\n  badgeCell(s) {\n    const t = String(s || \"\");\n    let bg = \"#E9ECF1\", fg = \"#6B7280\";\n    if (/conclu|respondid/i.test(t)) { bg = \"rgba(80,106,95,0.12)\"; fg = \"#3F5549\"; }\n    else if (/sem resposta/i.test(t)) { bg = \"rgba(200,54,43,0.09)\"; fg = \"#A82C22\"; }\n    else if (/aguard|pendent/i.test(t)) { bg = \"#FCEFD9\"; fg = \"#8A5A08\"; }\n    return this.cell(t, { badge: true, bg: bg, fg: fg });\n  }\n  tableBlock(title, hint, cols, rows) {\n    return {\n      isTable: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\", isEmptyList: !rows.length,\n      cols: cols.map(c => ({ label: c[0], align: c[1] ? \"right\" : \"left\" })), rows: rows\n    };\n  }\n  noteBlock(title, hint, text, esquerda) {\n    return {\n      isNote: true, hasHeader: !!title, title: title || \"\", hint: hint || \"\", text: text,\n      align: esquerda ? \"left\" : \"center\", maxW: esquerda ? \"74ch\" : \"none\", pad: esquerda ? \"24px 22px 26px\" : \"42px 22px\"\n    };\n  }\n  sec(kicker, hint, grid, blocks) {\n    return { hasHead: !!kicker, kicker: kicker || \"\", hint: hint || \"\", grid: grid, blocks: blocks };\n  }\n  casosTable(rows, title, hint) {\n    return this.tableBlock(title || \"\", hint || \"\",\n      [[\"Assunto\"], [\"Data\"], [\"Cliente\"], [\"Unidade\"], [\"Motivo\"], [\"Status\"]],\n      rows.map(c => ({\n        cells: [\n          this.cell(c.assunto, { color: \"#1B1F2A\" }),\n          this.cell(this.fmtData(c.data), { color: \"#6B7280\", wrap: \"nowrap\" }),\n          this.cell(c.cliente, { color: \"#1B1F2A\" }),\n          this.cell(c.unidade, { color: \"#6B7280\" }),\n          this.cell(c.motivo),\n          this.badgeCell(c.status)\n        ]\n      })));\n  }\n\n  /* ---------- views ---------- */\n  vExecutivo(D) {\n    const k = D.kpis || {}, casos = D.casos || [], N = this.topN();\n    const total = k.casos != null ? k.casos : casos.length;\n    const serie = this.semanal(casos).slice(-16);\n    const spark = serie.map(s => s.total);\n    const st = this.counts(casos, \"status\");\n    const semResp = st.filter(s => /sem resposta/i.test(s.label)).reduce((a, s) => a + s.value, 0);\n    const recentes = casos.slice().sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 20);\n    const tempos = [\n      { label: \"Médio\", v: k.p50_min != null ? k.p50_min : null, txt: k.tempo_medio_legivel, color: \"#0A7AC9\" },\n      { label: \"P90\", v: k.p90, txt: k.p90 != null ? Math.round(k.p90) + \" min\" : null, color: \"#E0A21A\" },\n      { label: \"P95\", v: k.p95, txt: k.p95 != null ? Math.round(k.p95) + \" min\" : null, color: \"#C8362B\" }\n    ].filter(m => m.v != null);\n    const maxT = Math.max(1, ...tempos.map(m => Number(m.v) || 0));\n    return [\n      this.sec(\"Indicadores do período\", this.rotuloPeriodo(D), \"repeat(auto-fit,minmax(252px,1fr))\", [\n s vêm calculados no arquivo\" : \"da média ao pior cenário recorrente\", \"repeat(auto-fit,minmax(252px,1fr))\", [\n        this.kpi(\"t1\", \"Médio\", escala[0].txt || \"—\",\n          \"Média do intervalo entre a entrada do e-mail e a primeira resposta.\", \"kpis.tempo_medio_legivel\"),\n        this.kpi(\"t2\", \"Mediano\", escala[1].txt || \"—\",\n          \"Valor central dos tempos de primeira resposta. Metade dos casos foi respondida antes disso.\", \"kpis.tempo_mediano_legivel\"),\n        this.kpi(\"t3\", \"P90\", escala[2].txt,\n          \"90% dos casos foram respondidos em até esse tempo — só 1 em 10 demorou mais.\", \"kpis.p90\"),\n        this.kpi(\"t4\", \"P95\", escala[3].txt,\n          \"95% dos casos foram respondidos em até esse tempo. É a leitura do pior cenário recorrente.\", \"kpis.p95\")\n      ])\n    ];\n  }\n\n  vProdutividade(D) {\n    const casos = D.casos || [], k = D.kpis || {}, N = this.topN();\n    const m = new Map();\n    casos.forEach(c => {\n      const a = ((c.assunto || \"(sem assunto)\") + \"\").trim() || \"(sem assunto)\";\n      if (!m.has(a)) m.set(a, { assunto: a, conversas: 0, recebidos: 0, respondidas: 0, semResposta: 0 });\n      const r = m.get(a);\n      r.conversas++;\n      r.recebidos += Number(c.interacoes || 1) || 1;\n      if (/respondido|conclu/i.test(String(c.status))) r.respondidas++; else r.semResposta++;\n    });\n    const rows = [...m.values()].sort((a, b) => b.conversas - a.conversas);\n    const q = this.state.fAssunto.trim().toLowerCase();\n    const fr = q ? rows.filter(r => r.assunto.toLowerCase().indexOf(q) >= 0) : rows;\n    const t = fr.reduce((a, r) => ({\n      conversas: a.conversas + r.conversas, recebidos: a.recebidos + r.recebidos,\n      respondidas: a.respondidas + r.respondidas, semResposta: a.semResposta + r.semResposta\n    }), { conversas: 0, recebidos: 0, respondidas: 0, semResposta: 0 });\n\n    if (!rows.length) {\n      return [this.sec(\"\", \"\", \"minmax(0,1fr)\", [\n        th .clientes || [], unidades = D.unidades || [];\n    const total = casos.length || 1;\n    const OBS = { tag: \"dado observado\", tagBg: \"#E6F0FA\", tagFg: \"#00447F\" };\n    const INF = { tag: \"inferência da leitura\", tagBg: \"#FCEFD9\", tagFg: \"#8A5A08\" };\n\n    const recl = casos.filter(c => /sim/i.test(String(c.reclamacao)));\n    const evit = casos.filter(c => /sim/i.test(String(c.evitavel)));\n    const semResp = casos.filter(c => !/respondido|conclu/i.test(String(c.status)) && /sem resposta/i.test(String(c.status)));\n    const longas = casos.filter(c => (Number(c.interacoes) || 1) >= 4);\n    const m1 = motivos[0], g1 = garg[0];\n    const top3m = motivos.slice(0, 3).reduce((a, m) => a + m.value, 0);\n    const top3c = clientes.slice(0, 3).reduce((a, m) => a + m.value, 0);\n\n    /* reincidência aparente: mesmo cliente, mesmo motivo, 2+ vezes */\n    const par = new Map();\n    casos.forEach(c => {\n      const key = (c.cliente || \"—\") + \" ‖ \" + (c.motivo || \"—\");\n      par.set(key, (par.get(key) || 0) + 1);\n    });\n    const reinc = [...par.entries()].filter(e => e[1] >= 2).sort((a, b) => b[1] - a[1]);\n    const casosReinc = reinc.reduce((a, e) => a + e[1], 0);\n    const excesso = reinc.reduce((a, e) => a + (e[1] - 1), 0);\n    const cronicos = reinc.filter(e => e[1] >= 3);\n    const notas = casos.map(c => Number(c.qualidade)).filter(n => !isNaN(n) && n > 0);\n    const media = notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null;\n\n    const conc = [];\n    if (m1) conc.push(Object.assign({ text: \"Uma única causa — “\" + m1.label + \"” — responde por \" + this.pctStr(m1.value, total) + \" dos contatos. As três maiores somam \" + this.pctStr(top3m, total) + \": atacar essas três reduz quase metade do volume da caixa.\" }, OBS));\n    if (evit.length) conc.push(Object.assign({ text: this.pctStr(evit.length, total) + \" dos contatos (\" + this.nf(evit.length) + \" casos) são potencialmente evitáveis — o cliente escreveu por l, { color: \"#1B1F2A\" }),\n          this.numCell(r.value),\n          this.cell(this.pctStr(r.value, extra || total), { align: \"right\", color: \"#5A6270\", wrap: \"nowrap\" })\n        ]\n      })));\n\n    const criticos = clientes.slice(0, 10).map(c => {\n      const meus = casos.filter(x => x.cliente === c.label);\n      const r = meus.filter(x => /sim/i.test(String(x.reclamacao))).length;\n      const e = meus.filter(x => /sim/i.test(String(x.evitavel))).length;\n      return { label: c.label, casos: c.value, recl: r, evit: e, taxa: r / (c.value || 1) };\n    }).sort((a, b) => b.recl - a.recl || b.casos - a.casos);\n\n    return [\n      this.sec(\"O que os dados estão tentando nos dizer\", this.rotuloPeriodo(D), \"minmax(0,1fr)\", [\n        { isConc: true, hasHeader: true, title: \"Conclusões executivas\", hint: this.nf(conc.length) + \" leituras · \" + this.nf(casos.length) + \" casos\", items: conc }\n      ]),\n      this.sec(\"Os dez maiores ofensores\", \"por volume de casos\", \"repeat(auto-fit,minmax(320px,1fr))\", [\n        tab10(\"Top 10 causas de contato\", \"sobre o total de casos\", motivos),\n        tab10(\"Top 10 pontos de atrito\", \"origem do travamento\", garg)\n      ]),\n      this.sec(\"Onde dói mais\", \"reclamação e contato evitável por causa\", \"repeat(auto-fit,minmax(320px,1fr))\", [\n        tab10(\"Top 10 causas de reclamação\", this.nf(recl.length) + \" casos com reclamação\", this.counts(recl, \"motivo\"), recl.length || 1),\n        tab10(\"Top 10 causas de contato evitável\", this.nf(evit.length) + \" casos evitáveis\", this.counts(evit, \"motivo\"), evit.length || 1)\n      ]),\n      this.sec(\"Clientes e unidades críticas\", \"volume, reclamação e contato evitável\", \"repeat(auto-fit,minmax(320px,1fr))\", [\n        this.tableBlock(\"Clientes mais críticos\", \"ordenados por reclamação\",\n          [[\"Cliente\"], [\"Casos\", 1], [\"Reclam.\", 1], [\"Evitáveis\", 1], [\"% reclam.\", 1]],\n          criticos.map(r => ({\n            cells: [this.cell(r.label, { color: \"#1B1F2A\" }), this.numCell(r.casos),\n              this.cell(this.nf(r.recl), { align: \"right\", color: r.recl ? \"#C8362B\" : \"#8A93A4\", wrap: \"nowrap\" }),\n              this.cell(this.nf(r.evit), { align: \"right\", color: \"#8A5A08\", wrap: \"nowrap\" }),\n              this.cell(this.pctStr(r.recl, r.casos), { align: \"right\", color: \"#5A6270\", wrap: \"nowrap\" })]\n          }))),\n        tab10(\"Unidades mais críticas\", \"por volume de casos\", unidades)\n      ]),\n      this.sec(\"Cruzamento para o fórum\", \"o que cada cliente mais reclama\", \"minmax(0,1fr)\", [matriz]),\n      this.sec(\"Reincidência aparente\", \"quantas vezes o mesmo cliente voltou pela mesma causa\", \"minmax(0,1fr)\", [\n        reinc.length\n          ? this.tableBlock(\"Combinações que se repetiram\", this.nf(excesso) + \" contatos de repetição · \" + this.nf(cronicos.length) + \" casos crônicos (3+)\",\n            [[\"Cliente\"], [\"Causa do contato\"], [\"Vezes\", 1]],\n            reinc.slice(0, 15).map(e => {\n              const p = e[0].split(\" ‖ \");\n              return { cells: [this.cell(p[0], { color: \"#1B1F2A\" }), this.cell(p[1]), this.numCell(e[1])] };\n            }))\n          : this.noteBlock(\"Combinações que se repetiram\", \"nenhuma\", \"Nenhum cliente acionou duas vezes pela mesma causa no período.\")\n      ]),\n      this.sec(\"Método e limites\", \"leia antes de apresentar\", \"minmax(0,1fr)\", [\n        this.noteBlock(\"O que este diagnóstico não sabe\", \"limitações da fonte\",\n          \"A fonte é a caixa de e-mails consolidada por assunto — uma conversa conta uma vez. Volume, status, interações e datas de entrada são dado observado. Causa, ponto de atrito, contato evitável, reclamação e nota de qualidade são classificações feitas na leitura dos e-mails: são inferência, e mudam se o critério mudar. Não há no arquivo data de conclusão, responsável, equipamento nem tempo de resposta por caso — por isso não há aqui tempo até a solução, backlog por idade, taxa de resolução, produtividade por pessoa nem faixas de SLA (30 min, 1 h, 2 h, 4 h). Reincidência é aparente: mesmo cliente e mesma causa no período, sem garantia de ser o mesmo equipamento.\", true)\n      ])\n    ];\n  }\n\n  /* ---------- filtro de período ---------- */\n  periodos(D) {\n    const set = new Set();\n    ((D && D.casos) || []).forEach(c => {\n      const s = String(c.data || \"\").slice(0, 7);\n      if (/^\\d{4}-\\d{2}$/.test(s)) set.add(s);\n    });\n    return [...set].sort();\n  }\n  filtroAtivo() { return this.state.fAno !== \"Todos\" || this.state.fMes !== \"Todos\"; }\n  rotuloPeriodo(D) {\n    const a = this.state.fAno, m = this.state.fMes;\n    if (m !== \"Todos\" && a !== \"Todos\") return MESES[Number(m) - 1] + \" de \" + a;\n    if (m !== \"Todos\") return MESES[Number(m) - 1] + \" (todos os anos)\";\n    if (a !== \"Todos\") return \"ano de \" + a;\n    return ((D && D.meta) || {}).periodo || \"—\";\n  }\n  filtrar(D) {\n    if (!this.filtroAtivo()) return D;\n    const a = this.state.fAno, m = this.state.fMes;\n    const casos = (D.casos || []).filter(c => {\n      const s = String(c.data || \"\").slice(0, 10);\n      if (s.length < 7) return false;\n      const p = s.split(\"-\");\n      return (a === \"Todos\" || p[0] === a) && (m === \"Todos\" || p[1] === m);\n    });\n    const ds = new Map();\n    casos.forEach(c => {\n      const d = new Date(c.data);\n      if (isNaN(d)) return;\n      const dia = DIAS[(d.getDay() + 6) % 7];\n      ds.set(dia, (ds.get(dia) || 0) + 1);\n    });\n    const respondidas = casos.filter(c => /respondido|conclu/i.test(String(c.status))).length;\n    return Object.assign({}, D, {\n      casos: casos,\n      motivos: this.counts(casos, \"motivo\"),\n      gargalos: this.counts(casos, \"gargalo\"),\n      clientes: this.counts(casos, \"cliente\"),\n      unidades: this.counts(casos, \"unidade\"),\n      volume: Object.assign({}, D.volume || {}, { dia_semana: DIAS.map(day => ({ day: day, value: ds.get(day) || 0 })) }),\n      kpis: Object.assign({}, D.kpis || {}, {\n        casos: casos.length,\n        recebidos: casos.reduce((s, c) => s + (Number(c.interacoes || 1) || 1), 0),\n        evitaveis: casos.filter(c => /sim/i.test(String(c.evitavel))).length,\n        taxa_resposta: casos.length ? Math.round(respondidas / casos.length * 1000) / 10 : 0\n      })\n    });\n  }\n\n  /* ---------- file loading ---------- */\n  loadFile(file) {\n    if (!file) return;\n    const fr = new FileReader();\n    fr.onload = () => {\n      try {\n        const d = JSON.parse(fr.result);\n        try { localStorage.setItem(\"cs_painel_dados\", JSON.stringify(d)); } catch (e) {}\n        this.setState({ data: d, dragging: false });\n      } catch (e) {\n        this.setState({ dragging: false });\n        alert(\"Não foi possível ler o arquivo: o conteúdo não é um JSON válido.\");\n      }\n    };\n    fr.readAsText(file);\n  }\n\n  vNaoLidos(D) {\n    const nl = D.nao_lidos || {};\n    const atual = nl.atual || {};\n    const hist = (nl.historico || []).slice();\n    const temAtual = atual.valor != null;\n    const emAtual = atual.em ? String(atual.em).replace(\"T\", \" \").slice(0, 16) : \"—\";\n    const ontem = hist.length ? hist[hist.length - 1] : {};\n    const anteontem = hist.length > 1 ? hist[hist.length - 2] : {};\n    const varFim = (ontem.as18 != null && ontem.as2359 != null) ? (ontem.as2359 - ontem.as18) : null;\n    const varDia = (ontem.as2359 != null && anteontem.as2359 != null) ? (ontem.as2359 - anteontem.as2359) : null;\n    const fmtVar = v => v == null ? \"—\" : (v > 0 ? \"+\" + this.nf(v) : (v < 0 ? \"−\" + this.nf(-v) : \"0\"));\n    const serie = hist.slice(-30).filter(d => d.as2359 != null).map(d => ({ label: this.fmtData(d.data).slice(0, 5), value: d.as2359 }));\n    const linhas = hist.slice(-30).slice().reverse().map(d => {\n      const vd = (d.as18 != null && d.as2359 != null) ? (d.as2359 - d.as18) : null;\n      return { cells: [\n        this.cell(this.fmtData(d.data), { wrap: \"nowrap\" }),\n        this.cell(d.as18 == null ? \"—\" : this.nf(d.as18), { align: \"right\", color: \"#022064\", wrap: \"nowrap\" }),\n        this.cell(d.as2359 == null ? \"—\" : this.nf(d.as2359), { align: \"right\", color: \"#022064\", wrap: \"nowrap\" }),\n        this.cell(fmtVar(vd), { align: \"right\", color: vd == null ? \"#6B7280\" : (vd > 0 ? \"#C8362B\" : \"#3F5549\"), wrap: \"nowrap\" })\n      ] };\n    });\n\n    // heatmap volume: dia da semana x hora (usa casos ja filtrados por periodo)\n    const casos = D.casos || [];\n    const DOW = [\"Seg\", \"Ter\", \"Qua\", \"Qui\", \"Sex\", \"Sáb\", \"Dom\"];\n    const di = g => (g + 6) % 7;\n    const mat = DOW.map(() => new Array(24).fill(0));\n    const totCol = new Array(24).fill(0);\n    const totRow = new Array(7).fill(0);\n    casos.forEach(c => {\n      const dt = new Date(c.data);\n      if (isNaN(dt)) return;\n      const r = di(dt.getDay()), h = dt.getHours();\n      mat[r][h]++; totCol[h]++; totRow[r]++;\n    });\n    const horasAtivas = [];\n    for (let h = 6; h <= 20; h++) horasAtivas.push(h);\n    let maxCel = 1;\n    for (let r = 0; r < 7; r++) for (let h = 0; h < 24; h++) if (mat[r][h] > maxCel) maxCel = mat[r][h];\n    const heatmap = {\n      isMatrix: true, hasHeader: true, title: \"Volume por dia da semana × hora\",\n      hint: this.nf(casos.length) + \" contatos · quanto mais escuro, mais volume\",\n      corner: \"Dia\",\n      cols: horasAtivas.map(h => ({ label: h + \"h\" })),\n      rows: DOW.map((d, r) => ({\n        label: d,\n        cells: horasAtivas.map(h => {\n          const v = mat[r][h], t = v / maxCel;\n          return {\n            v: v ? this.nf(v) : \"—\",\n            title: d + \" · \" + h + \"h: \" + this.nf(v),\n            bg: !v ? \"#F8FAFC\" : (t > 0.82 ? \"#004C96\" : \"rgba(0,76,150,\" + (0.06 + 0.36 * t).toFixed(3) + \")\"),\n            fg: v && t > 0.82 ? \"#ffffff\" : \"#022064\"\n          };\n        }),\n        total: this.nf(totRow[r])\n      }))\n    };\n\n    // nao lidos ao longo do dia: media por hora das leituras (amostras)\n    const amostras = nl.amostras || [];\n    const somaH = new Array(24).fill(0), cntH = new Array(24).fill(0);\n    amostras.forEach(a => {\n      const dt = new Date(a.ts);\n      if (isNaN(dt)) return;\n      const h = dt.getHours();\n      somaH[h] += Number(a.valor) || 0; cntH[h]++;\n    });\n    const linhaHora = [];\n    for (let h = 0; h < 24; h++) if (cntH[h]) linhaHora.push({ label: (h < 10 ? \"0\" + h : \"\" + h) + \"h\", value: Math.round(somaH[h] / cntH[h]) });\n\n    return [\n      this.sec(\"Caixa de Entrada — não lidos\", \"trocas@disktrans.com.br\", \"repeat(auto-fit,minmax(240px,1fr))\", [\n        this.kpi(\"nl1\", \"Não lidos agora\", temAtual ? this.nf(atual.valor) : \"—\", \"Número de e-mails não lidos na Caixa de Entrada, lido direto do Outlook (UnReadItemCount).\", \"nao_lidos.atual\", { sub: temAtual ? (\"atualizado em \" + emAtual) : \"sem leitura ainda\" }),\n        this.kpi(\"nl2\", \"Fim do expediente (18h)\", ontem.as18 != null ? this.nf(ontem.as18) : \"—\", \"Quantos não lidos sobraram às 18h do último dia registrado.\", \"nao_lidos.dias[].as18\", { sub: ontem.data ? this.fmtData(ontem.data) : \"aguardando 1a foto\" }),\n        this.kpi(\"nl3\", \"Fim do dia (23:59)\", ontem.as2359 != null ? this.nf(ontem.as2359) : \"—\", \"Quantos não lidos sobraram às 23:59 do último dia registrado.\", \"nao_lidos.dias[].as2359\", { sub: ontem.data ? this.fmtData(ontem.data) : \"aguardando 1a foto\" }),\n        this.kpi(\"nl4\", \"Variação 18h -> 23:59\", fmtVar(varFim), \"Diferença do backlog entre 18h e 23:59 (negativo = reduziu; positivo = entrou mais do que foi lido).\", \"as2359 - as18\", { sub: varDia != null ? (\"fechamento vs. dia anterior: \" + fmtVar(varDia)) : \"\" })\n      ]),\n      this.sec(\"Volume por dia e hora\", \"quando os contatos chegam — respeita o filtro de período\", \"minmax(0,1fr)\", [\n        casos.length ? heatmap : this.noteBlock(\"Sem volume no período\", \"\", \"Ajuste o filtro de período para ver o mapa de calor.\", false)\n      ]),\n      this.sec(\"Não lidos ao longo do dia\", \"média por hora, a partir das leituras automáticas\", \"minmax(0,1fr)\", [\n        linhaHora.length >= 2 ? this.areaBlock(\"Não lidos por hora do dia\", \"média das leituras registradas\", linhaHora, \"#F4941D\", \"rgba(244,148,29,0.28)\")\n          : this.noteBlock(\"Em formação\", \"\", \"Conforme as leituras de 30 em 30 minutos se acumulam, a curva de não lidos por hora aparece aqui.\", false)\n      ]),\n      this.sec(\"Evolução do fim do dia\", \"não lidos às 23:59 — últimos \" + serie.length + \" dias\", \"minmax(0,1fr)\", [\n        serie.length >= 2 ? this.areaBlock(\"Não lidos às 23:59\", \"quanto sobrou no fim de cada dia\", serie, \"#004C96\", \"rgba(0,76,150,0.28)\")\n          : this.noteBlock(\"Histórico em formação\", \"\", \"Assim que as fotos das 18h e 23:59 forem capturadas por alguns dias, a evolução aparece aqui.\", false)\n      ]),\n      this.sec(\"Histórico diário\", \"foto das 18h e 23:59 e a variação no fim do dia\", \"minmax(0,1fr)\", [\n        hist.length ? this.tableBlock(\"Não lidos por dia\", this.nf(hist.length) + \" dias registrados\", [[\"Dia\"], [\"18h\", 1], [\"23:59\", 1], [\"Var. 18h->23:59\", 1]], linhas)\n          : this.noteBlock(\"Sem histórico ainda\", \"\", \"As fotos diárias serão preenchidas pelas tarefas agendadas das 18h e 23:59.\", false)\n      ])\n    ];\n  }\n\n  renderVals() {\n    const raw = this.state.data;\n    const D = raw ? this.filtrar(raw) : null;\n    const k = (D && D.kpis) || {}, meta = (D && D.meta) || {};\n    const copy = VIEW_COPY[this.state.tab] || VIEW_COPY.executivo;\n    this.filtro = this.filtroAtivo();\n    let sections = [];\n    if (D) {\n      const fn = { executivo: \"vExecutivo\", motivos: \"vMotivos\", atendimentos: \"vAtendimentos\", qualidade: \"vQualidade\", produtividade: \"vProdutividade\", diagnostico: \"vDiagnostico\", naolidos: \"vNaoLidos\" }[this.state.tab] || \"vExecutivo\";\n      sections = this[fn](D);\n    }\n    const per = this.periodos(raw);\n    const anos = [...new Set(per.map(p => p.slice(0, 4)))].sort().reverse();\n    const meses = [...new Set(per.filter(p => this.state.fAno === \"Todos\" || p.slice(0, 4) === this.state.fAno).map(p => p.slice(5, 7)))].sort();\n    return {\n      isLoading: this.state.loading,\n      filtroAtivo: this.filtro,\n      limparFiltro: () => this.setState({ fAno: \"Todos\", fMes: \"Todos\" }),\n      filtros: [\n        {\n          label: \"Ano\", value: this.state.fAno,\n          onChange: e => this.setState({ fAno: e.target.value, fMes: \"Todos\" }),\n          options: [{ value: \"Todos\", label: \"Todos os anos\" }].concat(anos.map(a => ({ value: a, label: a })))\n        },\n        {\n          label: \"Mês\", value: this.state.fMes,\n          onChange: e => this.setState({ fMes: e.target.value }),\n          options: [{ value: \"Todos\", label: \"Todos os meses\" }].concat(meses.map(m => ({\n            value: m, label: MESES[Number(m) - 1].charAt(0).toUpperCase() + MESES[Number(m) - 1].slice(1)\n          })))\n        }\n      ],\n      needsData: !this.state.loading && !D,\n      hasData: !!D,\n      isDemo: !!meta.demo,\n      viewEyebrow: copy[0],\n      viewTitle: copy[1],\n      viewSub: copy[2],\n      sections: sections,\n      metaItems: [\n        { label: this.filtro ? \"Período filtrado\" : \"Período\", value: this.rotuloPeriodo(raw) },\n        { label: \"Atualizado em\", value: meta.gerado_em ? String(meta.gerado_em).replace(\"T\", \" \").slice(0, 16) : \"—\" },\n        { label: \"Casos consolidados\", value: this.nf(k.casos != null ? k.casos : (D && D.casos ? D.casos.length : null)) }\n      ],\n      tabs: TAB_LIST.map(t => {\n        const on = t[0] === this.state.tab;\n        return {\n          label: t[1],\n          onClick: () => {\n            this.setState({ tab: t[0], tip: null });\n            try { history.replaceState(null, \"\", \"?tab=\" + t[0]); } catch (e) {}\n          },\n          bg: on ? \"#D6DAE2\" : \"transparent\",\n          color: on ? \"#ffffff\" : \"#6B7280\",\n          weight: on ? \"700\" : \"500\",\n          mark: on ? \"#F4941D\" : \"transparent\"\n        };\n      }),\n      dropBorder: this.state.dragging ? \"#F4941D\" : \"#D6DAE2\",\n      onDragOver: e => { e.preventDefault(); if (!this.state.dragging) this.setState({ dragging: true }); },\n      onDragLeave: () => this.setState({ dragging: false }),\n      onDrop: e => { e.preventDefault(); this.loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); },\n      onPick: e => this.loadFile(e.target.files && e.target.files[0])\n    };\n  }\n}\n\n<\/script>\n\n\n</body></html>"</script>
